      (function() {
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch ? _origFetch.bind(window) : function() {
            return Promise.resolve(new Response());
          };

            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
